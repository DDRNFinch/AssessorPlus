<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apprentice+ Review Transfer Demo</title><style>body{font-family:Arial,sans-serif;background:#f5f7f7;color:#13262b;margin:0;padding:20px}.wrap{max-width:720px;margin:auto}.card{background:#fff;border:1px solid #d8dede;border-radius:12px;padding:16px;margin-bottom:12px}h1{font-size:22px}h2{font-size:16px}label{display:block;font-size:12px;font-weight:700;margin-top:10px}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cfd7d7;border-radius:8px;margin-top:4px}button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#6d28d9;color:#fff}.light{background:#eee}.row{display:flex;gap:8px;flex-wrap:wrap}.qr{display:grid;place-items:center;min-height:200px;border:1px solid #ddd;border-radius:10px;margin-top:12px}.result{white-space:pre-wrap;background:#fafafa;border:1px solid #ddd;border-radius:8px;padding:10px;margin-top:10px}.note{font-size:12px;color:#667}</style></head><body><div class="wrap"><h1>Apprentice+ Review Transfer Demo</h1><div class="card"><h2>Share review data with Assessor+</h2><p class="note">This demo deliberately contains no learner name or contact details.</p><label>Course<input id="course" value="Bricklayer ST0095"></label><label>Progress %<input id="progress" type="number" value="61"></label><label>KSBs completed<input id="ksb" type="number" value="36"></label><label>KSB total<input id="ksbTotal" type="number" value="59"></label><label>OTJ hours<input id="otj" type="number" value="84"></label><label>OTJ required<input id="otjRequired" type="number" value="96"></label><label>Learner reflection<textarea id="reflection">I feel confident with cavity walling but need more practice with setting out.</textarea></label><label>Five suggested targets, one per line<textarea id="targets">Complete the next practical assignment
Upload the monthly portfolio
Reach the required OTJ position
Complete the next Academy test
Prepare for the next review</textarea></label><div class="row" style="margin-top:12px"><button class="primary" id="generate">Generate QR</button><button class="light" id="download">Download .apreview</button></div><div class="qr" id="qr"></div></div><div class="card"><h2>Receive completed review from Assessor+</h2><input id="file" type="file" accept=".apreview,.json"><label>Or paste review text<textarea id="outcomeText"></textarea></label><button class="primary" id="import" style="margin-top:10px">Import review</button><div class="result" id="result">No review imported.</div></div></div><script src="./qrcode-browser.js"></script><script src="./review-transfer.js"></script><script>let current=null;function snapshot(){return ApprenticeReviewTransfer.makeSnapshot({course:course.value,progressPercent:progress.value,ksbCompleted:ksb.value,ksbTotal:ksbTotal.value,otjHours:otj.value,otjRequired:otjRequired.value,learnerReflection:reflection.value,suggestedTargets:targets.value.split('\n').filter(Boolean)})}generate.onclick=()=>{current=snapshot();qr.innerHTML='';qr.appendChild(ApprenticeQR.toCanvas(JSON.stringify(current),320))};download.onclick=()=>{current=current||snapshot();ApprenticeReviewTransfer.download('ApprenticePlus_Review_Snapshot.apreview',JSON.stringify(current))};file.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>outcomeText.value=r.result;r.readAsText(f)};import.onclick=()=>{try{let o=ApprenticeReviewTransfer.parseOutcome(outcomeText.value);result.textContent=`Review date: ${o.reviewDate}\nNext review: ${o.nextReviewDate}\nRAG: ${o.rag}\nAttendance: ${o.attendancePercent}%\n\nTargets:\n${(o.targets||[]).map((t,i)=>`${i+1}. ${t.text}${t.dueDate?' — '+t.dueDate:''}`).join('\n')}\n\nTutor summary:\n${o.tutorSummary||''}`}catch(e){alert(e.message)}};</script></body></html>
